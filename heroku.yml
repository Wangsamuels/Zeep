# One app per network (zeep-api-test, zeep-api-main); same code, different config vars.
setup:
  addons:
    - plan: heroku-postgresql
    - plan: heroku-redis
build:
  docker:
    web: Dockerfile.node
    treasury: Dockerfile.node
    wallet: Dockerfile.rust
    watcher: Dockerfile.rust
    payouts: Dockerfile.rust
release:
  image: web
  command:
    - node dist/release.js
run:
  web: node dist/server.js
  treasury: node dist/workers/treasury.js
  # CHAIN_BACKEND=lightclient: run exactly one `wallet` dyno (Standard-2X); keep watcher/payouts at 0.
  wallet: /app/bin/zeep-wallet
  # CHAIN_BACKEND=rpc (Zallet on a VPS): run watcher=1 and payouts=1 instead of wallet.
  watcher: /app/bin/zeep-watcher
  payouts: /app/bin/zeep-payouts
